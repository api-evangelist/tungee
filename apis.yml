description: Tungee (Guangzhou Tungee Technology Co., Ltd., 探迹科技) is a Chinese AI
  sales-intelligence company backed by Qiming Venture Partners. Its Tungee AI Sales
  Cloud covers the full B2B sales cycle -- AI prospecting over a 300M+ company knowledge
  graph, inbound capture, outreach via call center, SMS, and email, and an AI CRM --
  plus a Sales GPT agent line, a mobile app, and a DingTalk edition. The group also
  operates Futern, an international B2B leads product, and reports 50,000+ customers.
  Tungee publishes no public developer portal or API documentation.
